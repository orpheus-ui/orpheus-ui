<svg xmlns="http://www.w3.org/2000/svg" width="680" height="316" viewBox="0 0 680 316" role="img" aria-label="Terminal: Raèf Orpheus, full-stack developer and designer">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; fill: #c9d1d9; white-space: pre; }
    .user { fill: #7ee787; }
    .path { fill: #79c0ff; }
    .dim { fill: #8b949e; }
    .accent { fill: #d2a8ff; }
    .key { fill: #ffa657; }
    .title { fill: #8b949e; font-size: 13px; }
    .line { animation: show 0.25s ease-out backwards; }
    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes show { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 50% { fill-opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .line { animation: none; }
      .cursor { animation: none; }
    }
  </style>

  <rect x="0.5" y="0.5" width="679" height="315" rx="10" fill="#0d1117" stroke="#30363d"/>
