  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="340" y="23" text-anchor="middle" class="title">raef@orpheus: ~ — zsh</text>

  <text x="24" y="70" class="line" style="animation-delay:0.2s"><tspan class="user">raef@orpheus</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$</tspan> whoami</text>
  <text x="24" y="96" class="line" style="animation-delay:0.7s"><tspan class="accent">Raèf Orpheus</tspan> <tspan class="dim">//</tspan> full-stack developer · designer · music producer</text>

  <text x="24" y="130" class="line" style="animation-delay:1.3s"><tspan class="user">raef@orpheus</tspan><tspan class="dim">:</tspan><tspan class="path">~</tspan><tspan class="dim">$</tspan> cat stack.yml</text>
